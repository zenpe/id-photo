name: Node 24 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    env:
      VUE_APP_API_BASE_URL: https://ci.invalid
      VUE_APP_BRAND_NAME: CI fixture
      VUE_APP_OPERATOR: CI fixture
      VUE_APP_CONTACT: ci@invalid
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Run flow regressions
        run: yarn test:node24
      - name: Use public CI AppID fixture
        run: node -e "const fs=require('fs');const p='src/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));m['mp-weixin'].appid='wx0000000000000000';fs.writeFileSync(p,JSON.stringify(m));"
      - name: Build WeChat mini-program
        run: yarn build:mp-weixin
      - name: Build H5
        run: yarn build:h5
